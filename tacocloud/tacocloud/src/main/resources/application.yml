security:
  user:
    name: buzz
    password: infinity

taco:
  orders:
    pageSize: 10


  discount:
    codes:
      abcdef: 10

tacocloud:
  # TC-28 - Seleccion de transporte sin recompilar
  messaging:
    transport: ${TACOCLOUD_MESSAGING_TRANSPORT:noop}
    destination: ${TACOCLOUD_MESSAGING_DESTINATION:tacocloud.order.queue}
  # Fin TC-28
  # TC-29 - Politica del publicador outbox
  outbox:
    batch-size: 20
    max-attempts: 5
    retry-delay: PT5S
    stale-after: PT1M
    poll-delay-ms: 1000
  # Fin TC-29
  # TC-26 - Politica determinista de cola y ETA
  kitchen:
    queue-limit: 50
    eta:
      base-minutes: 5
      queue-minutes: 4
      quantity-minutes: 2
      complexity-minutes: 1
  # Fin TC-26
  time-zone: UTC #modificacion para TC-20
  # TC-14 - Politica economica del pedido
  order:
    max-item-quantity: 10
  pricing:
    currency: USD
  # TC-22 - Umbral de votos para ranking
  ratings:
    min-votes: 1
  # Fin TC-22
  # Fin TC-14
  # TC-15 - Cupones academicos configurados externamente
  coupons:
    definitions:
      - code: SAVE10
        type: PERCENTAGE
        value: 10
        valid-from: "2020-01-01"
        valid-until: "2099-12-31"
        minimum-purchase: 5.00
        maximum-discount: 5.00
      - code: LESS3
        type: FIXED
        value: 3.00
        valid-from: "2020-01-01"
        valid-until: "2099-12-31"
        minimum-purchase: 3.00
      - code: OLD10
        type: PERCENTAGE
        value: 10
        valid-from: "2020-01-01"
        valid-until: "2021-12-31"
      - code: FUTURE10
        type: PERCENTAGE
        value: 10
        valid-from: "2099-01-01"
        valid-until: "2099-12-31"
  # Fin TC-15
  # TC-18 - Reglas divertidas configurables por tipo, nunca por ID
  taco-rules:
    hot-requires-type: VEGGIES
    pair:
      trigger-type: CHEESE
      required-type: SAUCE
  # Fin TC-18
  security:
    allowed-origin: ${TACOCLOUD_ALLOWED_ORIGIN:http://localhost:8080} #modificacion para TC-11
  tc11-demo:
    password: ${TACOCLOUD_TC11_DEMO_PASSWORD:} #modificacion para TC-11



#logging:
#  level:
#    org.springframework.data.rest: debug
logging:
  pattern:
    level: "%5p [corr:%X{correlationId:-none}]"

# tag::springBootAdminCreds[]
# tag::springBootAdminUri[]
spring:
# end::springBootAdminUri[]
# end::springBootAdminCreds[]
  application:
    name: taco-cloud
  # TC-28 - Conexion externa por ambiente
  rabbitmq:
    host: ${TACOCLOUD_RABBIT_HOST:localhost}
    port: ${TACOCLOUD_RABBIT_PORT:5672}
    username: ${TACOCLOUD_RABBIT_USERNAME:guest}
    password: ${TACOCLOUD_RABBIT_PASSWORD:guest}
  artemis:
    host: ${TACOCLOUD_ARTEMIS_HOST:localhost}
    port: ${TACOCLOUD_ARTEMIS_PORT:61616}
    user: ${TACOCLOUD_ARTEMIS_USERNAME:}
    password: ${TACOCLOUD_ARTEMIS_PASSWORD:}
  # Fin TC-28
  data:
    mongodb:
      auto-index-creation: true #modificacion para TC-21
    rest:
      base-path: /data-api
    cassandra:
      keyspace-name: tacocloud
      schema-action: recreate
# tag::springBootAdminCreds[]
# tag::springBootAdminUri[]
  boot:
    admin:
      client:
        url: http://localhost:9090
# end::springBootAdminUri[]
        username: admin
        password: 53cr3t
# end::springBootAdminCreds[]

# The values given here are actually the default values. But they are explicitly
# set here as an example of setting the Kafka properties.
  kafka:
    bootstrap-servers: ${TACOCLOUD_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      default-topic: tacocloud.orders.topic
    producer:
      keySerializer: org.springframework.kafka.support.serializer.JsonSerializer
      valueSerializer: org.springframework.kafka.support.serializer.JsonSerializer
  jmx:
    enabled: true

#tag::exposeAll[]
#tag::excludeSome[]
#tag::healthShowDetails[]
#tag::infoGitModeFull[]
management:
#end::infoGitModeFull[]
#end::healthShowDetails[]
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
#end::exposeAll[]
        exclude: threaddump,heapdump
#end::excludeSome[]
#tag::healthShowDetails[]
  endpoint:
    health:
      show-details: when_authorized #modificacion para TC-11
      roles: ROLE_ADMIN
      probes:
        enabled: true
  health:
    probes:
      enabled: true
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
#end::healthShowDetails[]
#tag::infoGitModeFull[]
  info:
    git:
      mode: full
#end::infoGitModeFull[]

#tag::contactInfo[]
info:
  contact:
    email: support@tacocloud.com
    phone: 822-625-6831
#end::contactInfo[]

---
spring:
  profiles: prod

  datasource:
    url: jdbc:mysql://localhost/tacocloud
    username: tacouser
    password: tacopassword

logging:
  level:
    tacos: WARN
