server:
  port: 8081

# TC-30 - Configuracion externa del consumidor Rabbit
tacocloud:
  api-base-url: ${TACOCLOUD_API_BASE_URL:http://localhost:8080}
  messaging:
    destination: ${TACOCLOUD_MESSAGING_DESTINATION:tacocloud.order.queue}
  consumer:
    max-attempts: ${TACOCLOUD_CONSUMER_MAX_ATTEMPTS:3}
    retry-delay-ms: ${TACOCLOUD_CONSUMER_RETRY_DELAY_MS:2000}

spring:
  data:
    mongodb:
      uri: ${TACOCLOUD_KITCHEN_MONGODB_URI:mongodb://localhost:27017/tacocloud-kitchen?replicaSet=rs0}
      auto-index-creation: true
  rabbitmq:
    host: ${TACOCLOUD_RABBIT_HOST:localhost}
    port: ${TACOCLOUD_RABBIT_PORT:5672}
    username: ${TACOCLOUD_RABBIT_USERNAME:guest}
    password: ${TACOCLOUD_RABBIT_PASSWORD:guest}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
# Fin TC-30

---
spring:
  profiles: jms-template, jms-listener
# The values given here are actually the default values. But they are explicitly
# set here as an example of setting the Artemis properties.
  jms:
    template:
      receive-timeout: 2
  artemis:
    host: ${TACOCLOUD_ARTEMIS_HOST:localhost}
    port: ${TACOCLOUD_ARTEMIS_PORT:61616}
    user: ${TACOCLOUD_ARTEMIS_USERNAME:}
    password: ${TACOCLOUD_ARTEMIS_PASSWORD:}
    embedded:
      enabled: false
    
---
spring:
  profiles: kafka-listener
    
  kafka:
    bootstrap-servers: ${TACOCLOUD_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      default-topic: tacocloud.orders.topic
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: ${TACOCLOUD_KAFKA_GROUP_ID:tacocloud_kitchen}
      properties:
        spring.json.trusted.packages: tacos
      
      
      
      
      
